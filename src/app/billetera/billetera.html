<nav class="navbar navbar-dark bg-success shadow-sm mb-4">
  <div class="container">
    <span class="navbar-brand fw-bold">
      Mi Billetera UPN
    </span>
    <span class="text-white-50 small">
      Cuenta personal
    </span>
  </div>
</nav>

<div class="container py-2">
  <h1 class="display-5 fw-bold text-success">
    S/ {{ saldo.toFixed(2) }}
  </h1>
  <hr>
  <h4>Movimientos</h4>
  @for (m of movimientos; track $index) {
        <div
        class="d-flex justify-content-between align-items-center border rounded p-3 mb-2 bg-white">
            <div>
                <span
                class="badge me-2"
                [class.text-bg-danger]="m.tipo === 'Gasto'"
                [class.text-bg-success]="m.tipo === 'Recarga'">
                {{ m.tipo }}
                </span>

                @if ($index === 0) {
                <span class="badge text-bg-light border text-muted">
                    Más reciente
                </span>
                }
            </div>

            <strong
                [class.text-danger]="m.tipo === 'Gasto'"
                [class.text-success]="m.tipo === 'Recarga'">
                {{ m.tipo === 'Gasto' ? '-' : '+' }}
                S/ {{ m.monto.toFixed(2) }}
            </strong>
        </div>
    }

  @if (movimientos.length === 0) {
    <div class="alert alert-secondary">
      Aún no hay movimientos
    </div>
  }

  <app-nuevo-movimiento
    [saldo]="saldo"
    (movimientoValido)="registrarMovimiento($event)">
  </app-nuevo-movimiento>

</div>
